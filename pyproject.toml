[project]
name = "photo-sorter"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "tqdm",
    "exifread<4",
    "pillow",
    "pillow-heif",
]

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
# Photo timestamps are local wall clock, and one unreadable file may not stop the batch.
"scripts/reorder.py" = ["BLE001", "DTZ006", "DTZ007"]
